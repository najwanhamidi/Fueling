<!doctype html>
<html><head><meta charset="utf-8"><title>OCR harness</title></head>
<body>
<p>OCR test harness. Driven by tests/ocr/run.cjs (Playwright).</p>
<script type="module">
import { recognizeLabel, rotateCanvas } from '../../app/js/ocr/ocr.js';

function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// Mimic a phone photo: scale, tilt, blur, uneven lighting, sensor noise, JPEG.
async function degrade(img, d = {}) {
  let c = document.createElement('canvas');
  const s = d.scale || 1;
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  let g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  if (d.blur) g.filter = `blur(${d.blur}px)`;
  g.drawImage(img, 0, 0, c.width, c.height);
  g.filter = 'none';
  if (d.rotate) {
    // pad with a "table-top" background
    const r = rotateCanvas(c, d.rotate);
    const pad = document.createElement('canvas');
    pad.width = r.width + 60; pad.height = r.height + 60;
    const pg = pad.getContext('2d');
    pg.fillStyle = '#b9b2a6'; pg.fillRect(0, 0, pad.width, pad.height);
    pg.drawImage(r, 30, 30);
    c = pad; g = c.getContext('2d');
  }
  if (d.shadow) {
    const grad = g.createLinearGradient(0, 0, c.width, c.height);
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(0.6, 'rgba(0,0,0,0.12)'); grad.addColorStop(1, 'rgba(0,0,0,0.38)');
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  }
  if (d.noise) {
    const id = g.getImageData(0, 0, c.width, c.height);
    let seed = 12345;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff) - 0.5;
    for (let i = 0; i < id.data.length; i += 4) {
      const n = rnd() * d.noise * 2;
      id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n;
    }
    g.putImageData(id, 0, 0);
  }
  if (d.jpeg) {
    const url = c.toDataURL('image/jpeg', d.jpeg);
    const im = await loadImg(url);
    const c2 = document.createElement('canvas');
    c2.width = im.width; c2.height = im.height;
    c2.getContext('2d').drawImage(im, 0, 0);
    c = c2;
  }
  return c;
}

window.runOne = async (dataUrl, d, mode = 'thorough', dbg = true) => {
  const img = await loadImg(dataUrl);
  const c = await degrade(img, d || {});
  const t0 = performance.now();
  const r = await recognizeLabel(c, { mode, debug: dbg });
  return {
    ms: Math.round(performance.now() - t0),
    columns: r.columns.map((x) => ({ type: x.type, amount: x.amount, values: x.values, conf: x.conf })),
    servingSize: r.servingSize, score: r.score, rotated: r.rotated || 0, passes: r.passes, text: r.rawText, debugPasses: r.debugPasses,
    preview: d && Object.keys(d).length ? c.toDataURL('image/jpeg', 0.7) : null,
  };
};
window.ready = true;
</script>
</body></html>
